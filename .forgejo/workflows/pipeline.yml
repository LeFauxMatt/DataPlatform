# Load the media apps into DuckDB, then build and test every dbt model.
# Runs on every PR and push to main (CI), and nightly (a fresh build of the whole warehouse).
# Each run starts from an empty DuckDB file, so a PR is always tested against today's real data.
#
# Needs, in the repo's Actions settings:
#   variables  INFISICAL_URL, INFISICAL_PROJECT_ID
#   secrets    INFISICAL_CLIENT_ID, INFISICAL_CLIENT_SECRET   (machine identity dataplatform-ci, Viewer)
name: pipeline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

env:
  DUCKDB_PATH: ${{ github.workspace }}/data/media.duckdb
  DBT_PROFILES_DIR: ${{ github.workspace }}/transform

jobs:
  build:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://github.com/astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Credentials from Infisical
        run: ci/infisical-env.sh
        env:
          INFISICAL_URL: ${{ vars.INFISICAL_URL }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Extract and load (dlt)
        run: uv run load/media.py

      - name: Source freshness
        working-directory: transform
        run: uv run dbt source freshness

      - name: Build and test (dbt)
        working-directory: transform
        run: uv run dbt build

      - name: Lint SQL (sqlfluff)
        run: uv run sqlfluff lint transform/models

      - name: Docs
        if: always()
        working-directory: transform
        run: uv run dbt docs generate --static

      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: dbt-docs
          path: transform/target/static_index.html
          retention-days: 14
